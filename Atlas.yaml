# Clash Verge / Mihomo：先在地区组手选具体节点，再给服务组选择地区。
# 地区组的选择会被引用它的服务共享；所有出口均手选，重启保留选择。
# 使用前填写 airport1.url；DNS、TUN 和端口由 Clash Verge 管理。
# 分组参考 ACL4SSR Online Full 和 qichiyuhub 的 Mihomo 模板。
# 规则数据：https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest

proxy-providers:
  airport1:
    type: http
    url: ''
    path: ./proxies/compact-airport1.yaml
    # 订阅下载走直连，启动时即可拉取节点。
    proxy: DIRECT
    interval: 43200
    # 匹配地区代码、旗帜和全称；排除订阅说明，EMBY 仅供专用组。
    filter: '(?i)^(?!\s*(?:支持AI|剩余流量|距离下次重置|套餐到期|客服)).*(?:(?:🇭🇰|香港|Hong[ -]?Kong|(?:^|[^A-Z])HK(?:$|[^A-Z]))|(?:🇯🇵|日本|Japan|(?:^|[^A-Z])JP(?:$|[^A-Z]))|(?:🇸🇬|新加坡|Singapore|(?:^|[^A-Z])SG(?:$|[^A-Z]))|(?:🇺🇸|美国|美國|United[ -]?States|(?:^|[^A-Z])US(?:$|[^A-Z]))|EMBY)'
    exclude-filter: '3x'

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  # GEOSITE 分类共享同一个上游文件。
  geosite: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
  geoip: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat

profile:
  store-selected: true

proxy-groups:
  # 服务组：选通用代理或单独指定地区；AI 保持独立手选出口。
  - name: 🚀 通用代理
    type: select
    proxies: [🇭🇰 香港 HK, 🇯🇵 日本 JP, 🇸🇬 新加坡 SG, 🇺🇸 美国 US]
  - name: 🤖 AI
    type: select
    proxies: [🇺🇸 美国 US, 🇯🇵 日本 JP, 🇸🇬 新加坡 SG]
  - name: 📹 YouTube
    type: select
    proxies: [🚀 通用代理, 🇭🇰 香港 HK, 🇯🇵 日本 JP, 🇸🇬 新加坡 SG, 🇺🇸 美国 US]
  - name: 🍿 流媒体
    type: select
    proxies: [🚀 通用代理, 🇭🇰 香港 HK, 🇯🇵 日本 JP, 🇸🇬 新加坡 SG, 🇺🇸 美国 US]
  - name: 🎮 游戏
    type: select
    proxies: [🚀 通用代理, DIRECT, 🇭🇰 香港 HK, 🇯🇵 日本 JP, 🇸🇬 新加坡 SG, 🇺🇸 美国 US]
  - name: 💬 社交
    type: select
    proxies: [🚀 通用代理, 🇭🇰 香港 HK, 🇯🇵 日本 JP, 🇸🇬 新加坡 SG, 🇺🇸 美国 US]
  - name: 🎬 EMBY
    type: select
    use: [airport1]
    filter: '(?i)EMBY'
    empty-fallback: REJECT
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 通用代理, DIRECT, 🇭🇰 香港 HK, 🇯🇵 日本 JP, 🇸🇬 新加坡 SG, 🇺🇸 美国 US]

  # 地区组：选择具体节点。
  - name: 🇭🇰 香港 HK
    type: select
    use: [airport1]
    filter: '(?i)(?:🇭🇰|香港|Hong[ -]?Kong|(?:^|[^A-Z])HK(?:$|[^A-Z]))'
    exclude-filter: '(?i)EMBY'
    empty-fallback: REJECT
  - name: 🇯🇵 日本 JP
    type: select
    use: [airport1]
    filter: '(?i)(?:🇯🇵|日本|Japan|(?:^|[^A-Z])JP(?:$|[^A-Z]))'
    exclude-filter: '(?i)EMBY'
    empty-fallback: REJECT
  - name: 🇸🇬 新加坡 SG
    type: select
    use: [airport1]
    filter: '(?i)(?:🇸🇬|新加坡|Singapore|(?:^|[^A-Z])SG(?:$|[^A-Z]))'
    exclude-filter: '(?i)EMBY'
    empty-fallback: REJECT
  - name: 🇺🇸 美国 US
    type: select
    use: [airport1]
    filter: '(?i)(?:🇺🇸|美国|美國|United[ -]?States|(?:^|[^A-Z])US(?:$|[^A-Z]))'
    exclude-filter: '(?i)EMBY'
    empty-fallback: REJECT

rules:
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - DOMAIN,look.bigmelook.com,🎬 EMBY
  # 国内域名和 IP 优先于服务分流。
  - GEOSITE,cn,DIRECT
  - GEOSITE,category-games-cn,DIRECT
  - GEOIP,CN,DIRECT
  - GEOSITE,category-ai-!cn,🤖 AI
  - GEOSITE,youtube,📹 YouTube
  - GEOSITE,category-games-!cn,🎮 游戏
  # 社交总表加上未收录的常用平台，数据同样来自 geosite.dat。
  - OR,((GEOSITE,category-social-media-!cn),(GEOSITE,telegram),(GEOSITE,discord),(GEOSITE,reddit),(GEOSITE,tiktok)),💬 社交
  - GEOIP,telegram,💬 社交,no-resolve
  # 娱乐总表放在游戏和社交之后，剔除国内娱乐、Netflix 和 Disney。
  - AND,((GEOSITE,category-entertainment),(NOT,((GEOSITE,category-entertainment-cn))),(NOT,((GEOSITE,netflix))),(NOT,((GEOSITE,disney)))),🍿 流媒体
  - GEOSITE,geolocation-!cn,🚀 通用代理
  - MATCH,🐟 漏网之鱼
